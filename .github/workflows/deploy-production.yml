name: Deploy Tidcraft Backend (Production)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          port: ${{ secrets.PROD_EC2_PORT }}
          script: |
            set -e
            cd /home/prodtidcraftcomusr/laravel-backend
            trap 'php artisan up || true' EXIT
            git pull origin main
            composer install --optimize-autoloader
            php artisan down || true
            php artisan migrate --force
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            sudo chown -R prodtidcraftcomusr:www-data /home/prodtidcraftcomusr/laravel-backend
            sudo chmod -R 775 storage bootstrap/cache
            sudo systemctl reload php8.3-fpm
