name: Deploy Tidcraft Backend

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-backend
  cancel-in-progress: false   # let in-flight deploys finish; don't queue a race

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    timeout-minutes: 10
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TB_EC2_HOST }}
          username: ${{ secrets.TB_EC2_USERNAME }}
          key: ${{ secrets.TB_EC2_SSH_KEY }}
          port: ${{ secrets.TB_EC2_PORT }}
          command_timeout: 8m
          script: |
            set -e
            cd /home/devtidcraftcomusr/laravel-backend

            # Always exit maintenance mode, even if a later step fails
            trap 'php artisan up || true' EXIT

            echo "Pulling latest code..."
            git pull origin dev

            echo "Installing dependencies..."
            composer install --optimize-autoloader

            echo "Entering maintenance mode..."
            php artisan down || true

            echo "Running migrations..."
            php artisan migrate --force

            echo "Rebuilding caches..."
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Restarting queue workers..."
            php artisan queue:restart

            echo "Fixing permissions..."
            sudo chown -R devtidcraftcomusr:www-data /home/devtidcraftcomusr/laravel-backend
            sudo chmod -R 775 storage bootstrap/cache

            echo "Reloading PHP-FPM..."
            sudo systemctl reload php8.3-fpm

            echo "Backend deploy complete."
            # trap fires here automatically -> php artisan up
