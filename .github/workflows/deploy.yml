name: Deploy Tidcraft Backend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, mysql

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TB_EC2_HOST }}
          username: ${{ secrets.TB_EC2_USERNAME }}
          key: ${{ secrets.TB_EC2_SSH_KEY }}
          port: ${{ secrets.TB_EC2_PORT }}
          script: |
            set -e
            cd /home/devtidcraftcomusr/laravel-backend
            echo "Pulling latest code..."
            git pull origin main
            echo "Installing dependencies..."
            composer install --optimize-autoloader
            echo "Entering maintenance mode..."
            php artisan down || true
            echo "Running migrations..."
            php artisan migrate --force
            echo "Rebuilding caches..."
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "Restarting queue workers..."
            php artisan queue:restart
            echo "Exiting maintenance mode..."
            php artisan up
            echo "Fixing permissions..."
            sudo chown -R devtidcraftcomusr:www-data /home/devtidcraftcomusr/laravel-backend
            sudo chmod -R 775 storage bootstrap/cache
            echo "Reloading PHP-FPM..."
            sudo systemctl reload php8.3-fpm
            echo "Backend deploy complete."
